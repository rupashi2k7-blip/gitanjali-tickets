<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0c11">
<title>Gitanjali Cinema Hall</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="logo">গী</div>
    <div class="grow">
      <h1 id="hallName">Gitanjali Cinema Hall</h1>
      <p id="hallPlace">Santiniketan, Birbhum</p>
    </div>
    <button class="langbtn" onclick="gjToggleLang()" id="langBtn">বাংলা</button>
  </header>

  <main>
    <section class="view active" id="v-home"></section>
    <section class="view" id="v-shows"></section>
    <section class="view" id="v-seats"></section>
    <section class="view" id="v-pay"></section>
    <section class="view" id="v-ticket"></section>
    <section class="view" id="v-bookings"></section>
  </main>

  <div class="bottombar" id="bottombar"></div>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" id="tab-home" onclick="gjTab('home')">
      <span class="ic">🎬</span><span id="tabHomeLabel">Now Showing</span>
    </button>
    <button class="tab" id="tab-bookings" onclick="gjTab('bookings')">
      <span class="ic">🎟</span><span id="tabBookingsLabel">My Tickets</span>
    </button>
  </nav>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
